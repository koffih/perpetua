name: Feature request
description: Propose a new capability or a change in behaviour.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Perpetua aims to stay small: a CLI, a runner and a systemd timer. Proposals are
        weighed against that goal. Significant changes are recorded as
        [architecture decisions](https://koffih.github.io/perpetua/adr/).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The situation you are in and what Perpetua does not let you do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        The behaviour you would like, from the operator's point of view
        (commands, configuration keys, log lines).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, and other designs you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Session runner and admission gates
        - Session recording and summaries
        - systemd integration
        - WSL support
        - Installation
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options:
        - I would like to implement this myself.
        - I can help test a change.
        - I am proposing it for someone else to implement.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
